      AC5:
        archExtensions: ""
        cpuType: Cortex-M7
        floatingPointHardware: double
        options:
          version: 4
          afterBuildTasks:
            - name: "[Copy linker output for Keil User Commands]"
              abortAfterFailed: true
              command: mkdir ${KEIL_OUTPUT_DIR} & copy "${OutDir}\${ProjectName}.axf" "${KEIL_OUTPUT_DIR}\${KEIL_OUTPUT_NAME}.axf"
              disable: true
            - name: E:\MCU_Project\STM32H743Project\02High_Speed_Collection_AD7616\MDK-ARM\Hex2Bin\CopyHex_Flash.bat
              abortAfterFailed: true
              command: E:\MCU_Project\STM32H743Project\02High_Speed_Collection_AD7616\MDK-ARM\Hex2Bin\CopyHex_Flash.bat
              disable: true
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295
            C_FLAGS: --diag_suppress=1 --diag_suppress=1295
            c99-mode: true
            gnu-extensions: true
            one-elf-section-per-function: true
            optimization: level-3
            warnings: all-warnings
          global:
            output-debug-info: enable
            use-microLIB: false
          linker:
            $outputTaskExcludes:
              - .bin
            output-format: elf
            ro-base: "0x08000000"
            rw-base: "0x20000000"
            xo-base: ""
        scatterFilePath: Project.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: false
              mem:
